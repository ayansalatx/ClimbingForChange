            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Participants
      summary: Update a participant by their ID
      operationId: updateParticipant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the participant to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantRequest'
      responses:
        '200':
          description: Participant updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '401':
          description: Unauthorized - Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Participant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Participants
      summary: Delete a participant by their ID
      operationId: deleteParticipant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the participant to delete.
      responses:
        '204':
          description: Participant deleted successfully. No content returned.
        '401':
          description: Unauthorized - Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Participant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /laps:
    get:
      tags:
        - Laps
      summary: Get all lap records
      operationId: getLaps
      responses:
        '200':
          description: A list of all lap records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LapPopulated'
        '401':
          description: Unauthorized - Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Laps
      summary: Record a new lap
      operationId: recordLap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LapRequest'
      responses:
        '201':
          description: Lap recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lap'
        '400':
          description: Bad request (e.g., validation errors, invalid RFID tag for team).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /leaderboard:
    get:
      tags:
        - Leaderboard
      summary: Get the current leaderboard
      operationId: getLeaderboard
      parameters:
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            description: The ID of the event to get the leaderboard for. If not provided, uses the current event.
      responses:
        '200':
          description: The current leaderboard with team rankings and statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '401':
          description: Unauthorized - Invalid or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authentication

  schemas:
    # --- Base Entities (as stored/returned when not populated) ---
    Location:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the location. }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        provState: { type: string }
        country: { type: string }
        active: { type: boolean, default: true }
      required: [name, address, city, provState, country]

    Hill:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the hill. }
        name: { type: string }
        location:
          {
            type: string,
            description: ID of the location where the hill exists.,
          }
        lapElevationGain: { type: number, format: float }
        lapDistance: { type: number, format: float }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        distanceUnit: { type: string, enum: ['KM', 'MI'] }
      required: [name, location, lapElevationGain, lapDistance]

    Mountain:
      type: object
      properties:
        id:
          {
            type: string,
            description: Unique identifier for the virtual target mountain.,
          }
        name: { type: string }
        totalElevation: { type: number, format: float }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
      required: [name, totalElevation]

    RFIDTag:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the RFID tag. }
        serialNumber:
          { type: string, description: The unique serial number of the tag. }
      required: [serialNumber]

    Event:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the event. }
        name: { type: string }
        location:
          {
            type: string,
            description: ID of the location where the event is held.,
          }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        hills:
          type: array
          items:
            { type: string, description: ID of a Hill available at this event. }
        mountains:
          type: array
          items:
            {
              type: string,
              description: ID of a Mountain available to climb at this event.,
            }
        active: { type: boolean }
      required: [name, location, startDateTime, endDateTime]

    Team:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the team. }
        name: { type: string }
        event:
          {
            type: string,
            description: ID of the event the team participates in.,
          }
        hill:
          { type: string, description: ID of the hill the team is climbing. }
        mountain:
          {
            type: string,
            description: ID of the virtual mountain the team chose.,
          }
        rfidTag:
          {
            type: string,
            nullable: true,
            description: ID of the RFID tag assigned to this team.,
          }
        isSoloTeam: { type: boolean }
        lapsRequired: { type: number }
        totalDistanceRequired: { type: number }
        startDateTime: { type: string, format: date-time }
      required:
        [
          name,
          event,
          hill,
          mountain,
          lapsRequired,
          totalDistanceRequired,
          startDateTime,
        ]

    Participant:
      type: object
      properties:
        id:
          { type: string, description: Unique identifier for the participant. }
        firstName: { type: string }
        lastName: { type: string }
        team:
          {
            type: string,
            nullable: true,
            description: ID of the team the participant belongs to (can be null for a free agent).,
          }
        active: { type: boolean }
      required: [firstName, lastName]

    Lap:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the lap record. }
        team:
          { type: string, description: ID of the team that completed the lap. }
        rfidTag:
          {
            type: string,
            description: ID of the RFID tag that recorded the lap.,
          }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
      required: [team, rfidTag, startDateTime, endDateTime]

    # --- Populated Response Schemas ---
    EventPopulated:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            location: { $ref: '#/components/schemas/Location' }
            hills: { type: array, items: { $ref: '#/components/schemas/Hill' } }
            mountains:
              { type: array, items: { $ref: '#/components/schemas/Mountain' } }

    TeamPopulated:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            hill: { $ref: '#/components/schemas/Hill' }
            mountain: { $ref: '#/components/schemas/Mountain' }
            participants:
              {
                type: array,
                items: { $ref: '#/components/schemas/Participant' },
              }

    ParticipantPopulated:
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          properties:
            team: { $ref: '#/components/schemas/Team' }

    LapPopulated:
      allOf:
        - $ref: '#/components/schemas/Lap'
        - type: object
          properties:
            team: { $ref: '#/components/schemas/Team' }
            rfidTag: { $ref: '#/components/schemas/RFIDTag' }

    HillPopulated:
      allOf:
        - $ref: '#/components/schemas/Hill'
        - type: object
          properties:
            location: { $ref: '#/components/schemas/Location' }

    # --- Request Body Schemas (for POST/PUT) ---
    LocationRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        provState: { type: string }
        country: { type: string }
      required: [name, address, city, provState, country]

    HillRequest:
      type: object
      properties:
        name: { type: string }
        location:
          { type: string, description: MongoDB ObjectId of the location. }
        lapElevationGain: { type: number }
        lapDistance: { type: number }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        distanceUnit: { type: string, enum: ['KM', 'MI'] }
      required: [name, location, lapElevationGain, lapDistance]

    MountainRequest:
      type: object
      properties:
        name: { type: string }
        totalElevation: { type: number }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
      required: [name, totalElevation]

    RFIDTagRequest:
      type: object
      properties: { serialNumber: { type: string } }
      required: [serialNumber]

    EventRequest:
      type: object
      properties:
        name: { type: string }
        location:
          { type: string, description: MongoDB ObjectId of the location. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        hills: { type: array, items: { type: string } }
        mountains: { type: array, items: { type: string } }
        active: { type: boolean }
      required: [name, location, startDateTime, endDateTime]

    TeamRequest:
      type: object
      properties:
        name: { type: string }
        event: { type: string, description: MongoDB ObjectId of the event. }
        hill: { type: string, description: MongoDB ObjectId of the hill. }
        mountain:
          { type: string, description: MongoDB ObjectId of the mountain. }
        rfidTag:
          {
            type: string,
            nullable: true,
            description: MongoDB ObjectId of the RFID tag.,
          }
        isSoloTeam: { type: boolean, default: false }
        lapsRequired: { type: number, minimum: 1 }
        totalDistanceRequired: { type: number, minimum: 0 }
        startDateTime: { type: string, format: date-time }
      required:
        [
          name,
          event,
          hill,
          mountain,
          lapsRequired,
          totalDistanceRequired,
          startDateTime,
        ]

    ParticipantRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        team:
          {
            type: string,
            nullable: true,
            description: MongoDB ObjectId of the team.,
          }
      required: [firstName, lastName]

    LapRequest:
      type: object
      properties:
        team: { type: string, description: MongoDB ObjectId of the team. }
        rfidTag:
          { type: string, description: MongoDB ObjectId of the RFID tag. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
      required: [team, rfidTag, startDateTime, endDateTime]

    # --- Leaderboard Schemas ---
    LeaderboardResponse:
      type: object
      properties:
        eventId:
          {
            type: string,
            description: The ID of the event this leaderboard is for.,
          }
        lastUpdated:
          {
            type: string,
            format: date-time,
            description: When the leaderboard was last updated.,
          }
        teams:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardTeam'
      required: [eventId, lastUpdated, teams]

    LeaderboardTeam:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the team. }
        rank:
          {
            type: integer,
            minimum: 1,
            description: Current ranking position (1st,
            2nd,
            etc.).,
          }
        name: { type: string, description: Team name. }
        mountainName:
          {
            type: string,
            description: Name of the mountain the team is climbing.,
          }
        hillName:
          { type: string, description: Name of the hill the team is using. }
        lapsCompleted:
          {
            type: integer,
            minimum: 0,
            description: Number of laps completed so far.,
          }
        lapsRequired:
          {
            type: integer,
            minimum: 1,
            description: Total number of laps required to complete the mountain.,
          }
        totalElevation:
          {
            type: number,
            format: float,
            description: Total elevation gained so far (in feet or meters).,
          }
        progressPercentage:
          {
            type: number,
            format: float,
            minimum: 0,
            maximum: 100,
            description: Percentage of mountain completed.,
          }
        lastUpdateTime:
          {
            type: string,
            format: date-time,
            description: When the team last completed a lap.,
          }
        status:
          {
            type: string,
            enum: ['Not Started', 'Running', 'Finished'],
            description: Current status of the team.,
          }
        bestLapTime:
          {
            type: number,
            nullable: true,
            description: Best lap time in milliseconds (null if no laps completed).,
          }
        averageLapTime:
          {
            type: number,
            nullable: true,
            description: Average lap time in milliseconds (null if no laps completed).,
          }
        totalTime:
          {
            type: number,
            nullable: true,
            description: Total time from first to last lap in milliseconds (null if no laps completed).,
          }
      required:
        [
          id,
          rank,
          name,
          mountainName,
          hillName,
          lapsCompleted,
          lapsRequired,
          totalElevation,
          progressPercentage,
          lastUpdateTime,
          status,
        ]

    # --- Authentication Schemas ---
    LoginRequest:
      type: object
      properties:
        username: { type: string, description: User's username }
        password: { type: string, description: User's password }
      required: [username, password]

    AuthResponse:
      type: object
      properties:
        id: { type: string, description: User's unique identifier }
        username: { type: string, description: User's username }
        token: { type: string, description: JWT authentication token }
      required: [id, username, token]

    # --- Error Responses ---
    ErrorResponse:
      type: object
      properties: { error: { type: string } }
      required: [error]
      example: { error: 'Resource not found' }

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              value: { type: string, nullable: true }
              msg: { type: string }
              path: { type: string }
              location: { type: string }
            required: [msg, path, location]
      required: [errors]
