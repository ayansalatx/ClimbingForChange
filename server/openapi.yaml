openapi: 3.1.0
info:
  title: Climbing for Change API
  version: 1.0.0
  description: API for managing a charity climbing event, tracking teams, participants, and laps.

servers:
  - url: /api # Base path for all API endpoints

paths:
  /locations:
    get:
      tags:
        - Locations
      summary: Get all locations
      operationId: getLocations
      responses:
        '200':
          description: A list of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
    post:
      tags:
        - Locations
      summary: Create a new location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad request (e.g., missing body or validation errors if validation is added later)
          content:
            application/json:
              schema:
                # Assuming simple error for now, add ValidationErrorResponse if validation is applied
                $ref: '#/components/schemas/ErrorResponse'
  /locations/{id}: # New path for ID-based operations
    get:
      tags:
        - Locations
      summary: Get location by ID
      operationId: getLocationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the location to retrieve
      responses:
        '200':
          description: Location found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put: # Changed from PUT /
      tags:
        - Locations
      summary: Update a location by ID
      operationId: updateLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the location to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Assuming update uses the same structure as creation request body
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Location updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad request (e.g., validation errors if validation is added, invalid ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse' # Or ValidationErrorResponse
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete: # Changed from DELETE /
      tags:
        - Locations
      summary: Delete a location by ID
      operationId: deleteLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the location to delete
      responses:
        '200':
          description: Location deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "Location deleted successfully"
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mountains/physical:
    get:
      tags:
        - Mountains
      summary: Get all physical mountains
      operationId: getPhysicalMountains
      responses:
        '200':
          description: A list of physical mountains
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhysicalMountain'
    post:
      tags:
        - Mountains
      summary: Create a new physical mountain
      operationId: createPhysicalMountain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalMountainRequest'
      responses:
        '201':
          description: Physical mountain created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalMountain'
        '400':
          description: Bad request (e.g., missing body, validation errors)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
  /mountains/physical/{id}: # New path for ID-based operations
    get:
      tags:
        - Mountains
      summary: Get physical mountain by ID
      operationId: getPhysicalMountainById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the physical mountain to retrieve
      responses:
        '200':
          description: Physical mountain found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalMountain'
        '404':
          description: Physical mountain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put: # New PUT /physical/:id route
      tags:
        - Mountains
      summary: Update a physical mountain by ID
      operationId: updatePhysicalMountain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the physical mountain to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Assuming update uses the same structure as creation request body
              $ref: '#/components/schemas/PhysicalMountainRequest'
      responses:
        '200':
          description: Physical mountain updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalMountain'
        '400':
          description: Bad request (e.g., validation errors, invalid ID)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Physical mountain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete: # New DELETE /physical/:id route
      tags:
        - Mountains
      summary: Delete a physical mountain by ID
      operationId: deletePhysicalMountain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the physical mountain to delete
      responses:
        '200':
          description: Physical mountain deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "Physical mountain deleted successfully"
        '404':
          description: Physical mountain not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


