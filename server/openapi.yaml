components:
  schemas:
    # --- Base Entities (as stored/returned when not populated) ---
    Location:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the location. }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        provState: { type: string }
        country: { type: string }
        active: { type: boolean, default: true }
      required: [name, address, city, provState, country]

    Hill:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the hill. }
        name: { type: string }
        location: { type: string, description: ID of the location where the hill exists. }
        lapElevationGain: { type: number, format: float }
        lapDistance: { type: number, format: float }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        distanceUnit: { type: string, enum: ['KM', 'MI'] }
      required: [name, location, lapElevationGain, lapDistance]

    Mountain:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the virtual target mountain. }
        name: { type: string }
        totalElevation: { type: number, format: float }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        imageURL: { type: string, format: uri, nullable: true }
      required: [name, totalElevation]

    RFIDTag:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the RFID tag. }
        serialNumber: { type: string, description: The unique serial number of the tag. }
      required: [serialNumber]

    Event:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the event. }
        name: { type: string }
        location: { type: string, description: ID of the location where the event is held. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        hills:
          type: array
          items: { type: string, description: ID of a Hill available at this event. }
        mountains:
          type: array
          items: { type: string, description: ID of a Mountain available to climb at this event. }
        active: { type: boolean }
      required: [name, location, startDateTime, endDateTime]

    Team:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the team. }
        name: { type: string }
        event: { type: string, description: ID of the event the team participates in. }
        hill: { type: string, description: ID of the hill the team is climbing. }
        mountain: { type: string, description: ID of the virtual mountain the team chose. }
        rfidTagId: { type: string, nullable: true, description: ID of the RFID tag assigned to this team. }
        isSoloTeam: { type: boolean }
        lapsRequired: { type: number }
        totalDistanceRequired: { type: number }
        startDateTime: { type: string, format: date-time }
      required: [name, event, hill, mountain, lapsRequired, totalDistanceRequired, startDateTime]

    Participant:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the participant. }
        firstName: { type: string }
        lastName: { type: string }
        teamId: { type: string, nullable: true, description: ID of the team the participant belongs to (can be null for a free agent). }
        active: { type: boolean }
      required: [firstName, lastName]

    Lap:
      type: object
      properties:
        id: { type: string, description: Unique identifier for the lap record. }
        teamId: { type: string, description: ID of the team that completed the lap. }
        rfidTagId: { type: string, description: ID of the RFID tag that recorded the lap. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
      required: [teamId, rfidTagId, startDateTime, endDateTime]

    # --- Populated Response Schemas ---
    EventPopulated:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            location: { $ref: '#/components/schemas/Location' }
            hills: { type: array, items: { $ref: '#/components/schemas/Hill' } }
            mountains: { type: array, items: { $ref: '#/components/schemas/Mountain' } }

    TeamPopulated:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            hill: { $ref: '#/components/schemas/Hill' }
            mountain: { $ref: '#/components/schemas/Mountain' }
            participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }

    ParticipantPopulated:
      allOf:
        - $ref: '#/components/schemas/Participant'
        - type: object
          properties:
            teamId: { $ref: '#/components/schemas/Team' }

    LapPopulated:
      allOf:
        - $ref: '#/components/schemas/Lap'
        - type: object
          properties:
            teamId: { $ref: '#/components/schemas/Team' }
            rfidTagId: { $ref: '#/components/schemas/RFIDTag' }

    HillPopulated:
      allOf:
        - $ref: '#/components/schemas/Hill'
        - type: object
          properties:
            location: { $ref: '#/components/schemas/Location' }
            
    # --- Request Body Schemas (for POST/PUT) ---
    LocationRequest:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        provState: { type: string }
        country: { type: string }
      required: [name, address, city, provState, country]
    
    HillRequest:
      type: object
      properties:
        name: { type: string }
        location: { type: string, description: MongoDB ObjectId of the location. }
        lapElevationGain: { type: number }
        lapDistance: { type: number }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        distanceUnit: { type: string, enum: ['KM', 'MI'] }
      required: [name, location, lapElevationGain, lapDistance]

    MountainRequest:
      type: object
      properties:
        name: { type: string }
        totalElevation: { type: number }
        elevationUnit: { type: string, enum: ['FT', 'M'] }
        imageURL: { type: string, format: uri, nullable: true }
      required: [name, totalElevation]

    RFIDTagRequest:
      type: object
      properties: { serialNumber: { type: string } }
      required: [serialNumber]

    EventRequest:
      type: object
      properties:
        name: { type: string }
        location: { type: string, description: MongoDB ObjectId of the location. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
        hills: { type: array, items: { type: string } }
        mountains: { type: array, items: { type: string } }
        active: { type: boolean }
      required: [name, location, startDateTime, endDateTime]

    TeamRequest:
      type: object
      properties:
        name: { type: string }
        event: { type: string, description: MongoDB ObjectId of the event. }
        hill: { type: string, description: MongoDB ObjectId of the hill. }
        mountain: { type: string, description: MongoDB ObjectId of the mountain. }
        rfidTagId: { type: string, nullable: true, description: MongoDB ObjectId of the RFID tag. }
        isSoloTeam: { type: boolean, default: false }
        lapsRequired: { type: number, minimum: 1 }
        totalDistanceRequired: { type: number, minimum: 0 }
        startDateTime: { type: string, format: date-time }
      required: [name, event, hill, mountain, lapsRequired, totalDistanceRequired, startDateTime]

    ParticipantRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        teamId: { type: string, nullable: true, description: MongoDB ObjectId of the team. }
      required: [firstName, lastName]

    LapRequest:
      type: object
      properties:
        teamId: { type: string, description: MongoDB ObjectId of the team. }
        rfidTagId: { type: string, description: MongoDB ObjectId of the RFID tag. }
        startDateTime: { type: string, format: date-time }
        endDateTime: { type: string, format: date-time }
      required: [teamId, rfidTagId, startDateTime, endDateTime]

    # --- Error Responses ---
    ErrorResponse:
      type: object
      properties: { error: { type: string } }
      required: [error]
      example: { error: "Resource not found" }

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              value: { type: string, nullable: true }
              msg: { type: string }
              path: { type: string }
              location: { type: string }
            required: [msg, path, location]
      required: [errors]