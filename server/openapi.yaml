                  - $ref: '#/components/schemas/ErrorResponse'
  /events/{id}:
    get:
      tags:
        - Events
      summary: Get event by ID with populated location and physical mountains
      operationId: getEventById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the event to retrieve
      responses:
        '200':
          description: Event found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPopulated' # Assuming GET by ID returns populated version
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Events
      summary: Update an event by ID
      operationId: updateEvent
      description: Updates an existing event. The event ID must be provided in the path, and the updated event data in the request body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the event to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event' # Or EventPopulated depending on what the controller returns
        '400':
          description: Bad request (e.g., validation errors, invalid ID)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Events
      summary: Delete an event by ID
      operationId: deleteEvent
      description: Deletes an existing event. The event ID must be provided in the path, and the request body must contain the event data to be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: ID of the event to delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: Event deleted successfully
          content:
