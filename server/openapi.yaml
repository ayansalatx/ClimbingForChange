openapi: 3.1.0
info:
  title: Climbing for Change API
  version: 1.0.0
  description: API for managing a charity climbing event, tracking teams, participants, and laps.

servers:
  - url: /api # Base path for all API endpoints

paths:
  /locations:
    get:
      tags:
        - Locations
      summary: Get all locations
      operationId: getLocations
      responses:
        '200':
          description: A list of locations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
    post:
      tags:
        - Locations
      summary: Create a new location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '201':
          description: Location created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          description: Bad request (e.g., validation errors).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /locations/{id}:
    get:
      tags:
        - Locations
      summary: Get a location by its ID
      operationId: getLocationById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the location to retrieve.
      responses:
        '200':
          description: The requested location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Locations
      summary: Update a location by its ID
      operationId: updateLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the location to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationRequest'
      responses:
        '200':
          description: Location updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Locations
      summary: Delete a location by its ID
      operationId: deleteLocation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: The ID of the location to delete.
      responses:
        '204':
          description: Location deleted successfully. No content returned.
        '404':
          description: Location not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

